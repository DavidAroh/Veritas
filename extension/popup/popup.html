<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veritas Agent</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 200px;
      background: #0a0a0a;
      color: #e8e6e0;
      font-family: 'DM Mono', 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #1f1f1f;
      background: #0d0d0d;
    }

    .logo { display: flex; align-items: center; gap: 7px; }

    .logo-icon {
      width: 22px; height: 22px;
      border: 1.5px solid #b8ff57;
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-dot { width: 7px; height: 7px; background: #b8ff57; border-radius: 50%; }

    .logo-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: -0.02em;
      color: #e8e6e0;
    }

    .logo-text span { color: #b8ff57; }

    .status-pill {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 3px 8px;
      border-radius: 100px;
      border: 1px solid #2a2a2a;
      color: #888880;
      background: #111;
      transition: all 0.3s;
    }

    /* Loading */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      gap: 12px;
    }

    .spinner {
      width: 28px; height: 28px;
      border: 2px solid #1f1f1f;
      border-top-color: #b8ff57;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 11px;
      color: #555550;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Score area */
    .score-area {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 14px;
      border-bottom: 1px solid #1a1a1a;
    }

    .score-ring-wrap { position: relative; width: 72px; height: 72px; flex-shrink: 0; }
    .score-ring-wrap svg { transform: rotate(-90deg); }

    .score-center {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }

    .score-num {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .score-sub { font-size: 9px; color: #555550; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
    .score-info { flex: 1; }

    .score-label {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .score-summary { font-size: 11px; color: #666660; line-height: 1.5; }

    /* Warning */
    .warning-banner {
      margin: 8px 12px 0;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid;
      font-size: 11px;
      line-height: 1.5;
      display: flex;
      gap: 7px;
    }

    /* Tabs */
    .tabs { display: flex; border-bottom: 1px solid #1a1a1a; margin-top: 8px; }

    .tab {
      flex: 1;
      padding: 8px 12px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555550;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      margin-bottom: -1px;
    }

    .tab.active { color: #b8ff57; border-bottom-color: #b8ff57; }

    /* Claims */
    .claims-list { padding: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }

    .claim-item {
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid;
      cursor: pointer;
      transition: all 0.15s;
    }

    .claim-header { display: flex; gap: 7px; align-items: flex-start; }

    .claim-badge {
      width: 18px; height: 18px;
      border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 700;
      flex-shrink: 0; margin-top: 1px;
    }

    .claim-text { font-size: 11px; color: #c0beb8; line-height: 1.4; flex: 1; }

    .claim-reason {
      font-size: 10px; color: #555550; line-height: 1.4;
      margin-top: 6px; padding-top: 6px;
      border-top: 1px solid #1f1f1f;
      display: none;
    }

    .claim-item.expanded .claim-reason { display: block; }

    /* Signals */
    .signals-list { padding: 8px; display: flex; flex-direction: column; gap: 4px; max-height: 260px; overflow-y: auto; }

    .signal-item {
      display: flex; gap: 7px;
      padding: 7px 9px;
      border-radius: 5px;
      border: 1px solid #ffab4030;
      background: #ffab4008;
      font-size: 11px; color: #c0beb8; line-height: 1.4;
    }

    .signal-icon { color: #ffab40; flex-shrink: 0; font-size: 10px; margin-top: 2px; }

    /* Verdict */
    .verdict-box { margin: 8px; padding: 10px; border-radius: 6px; border: 1px solid #1f1f1f; background: #111; }
    .verdict-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: #444440; margin-bottom: 5px; }
    .verdict-text { font-size: 11px; color: #c0beb8; line-height: 1.5; }

    /* Source row */
    .source-row { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-top: 1px solid #1a1a1a; font-size: 10px; color: #555550; }
    .source-label { color: #444440; }

    /* Footer with actions */
    .footer-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      border-top: 1px solid #1a1a1a;
      background: #0d0d0d;
    }
    .icon-btn {
      background: transparent;
      border: 1px solid #2a2a2a;
      color: #888880;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }
    .icon-btn:hover { border-color: #b8ff57; color: #b8ff57; }
    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .icon-btn svg { width: 11px; height: 11px; }
    .shortcut-hint { font-size: 9px; color: #444440; letter-spacing: 0.05em; }

    /* Empty */
    .empty-state { display: flex; flex-direction: column; align-items: center; padding: 28px 16px; gap: 8px; text-align: center; }

    .empty-icon {
      width: 36px; height: 36px; border: 1px solid #1f1f1f; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0.4; margin-bottom: 4px;
    }

    .empty-title { font-size: 12px; color: #888880; }
    .empty-sub { font-size: 11px; color: #444440; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon"><div class="logo-dot"></div></div>
      <span class="logo-text">VERITAS<span>.</span></span>
    </div>
    <div class="status-pill" id="status-pill">Loading…</div>
  </div>

  <!-- Starts hidden; made visible after storage read to prevent flash -->
  <div id="main-content" style="visibility:hidden"></div>

  <div class="footer-row">
    <div style="display:flex;gap:6px">
      <button id="btn-refresh" class="icon-btn" title="Re-analyze (Alt+V)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>
        </svg>
        Refresh
      </button>
      <button id="btn-share" class="icon-btn" title="Share this analysis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        Share
      </button>
    </div>
    <button id="btn-settings" class="icon-btn" title="Open settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <!-- External script required by Manifest V3 CSP (no inline scripts allowed) -->
  <script src="popup.js"></script>
</body>
</html>
